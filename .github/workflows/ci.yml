name: FASTEK CENTRAL CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

permissions:
  contents: read

concurrency:
  group: fastek-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: TypeScript and Deno checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Display versions
        run: deno --version

      - name: Check source files exist
        id: sources
        shell: bash
        run: |
          if find src supabase/functions tests \
            -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) \
            -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No source files yet."
          fi

      - name: Format check
        if: steps.sources.outputs.found == 'true'
        run: deno fmt --check src supabase/functions tests

      - name: Lint
        if: steps.sources.outputs.found == 'true'
        run: deno lint src supabase/functions tests

      - name: Type check
        if: steps.sources.outputs.found == 'true'
        shell: bash
        run: |
          find src supabase/functions tests \
            -type f \( -name '*.ts' -o -name '*.tsx' \) \
            -print0 | xargs -0 -r deno check

      - name: Verify migrations exist
        run: |
          test -f supabase/migrations/20261101120000_init_applications.sql
          test -f supabase/migrations/20261106120000_installation_auth_tokens.sql
          echo "Migration files found."

  api-contract:
    name: OpenAPI contract validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@1.27.1 lint docs/openapi.yaml
